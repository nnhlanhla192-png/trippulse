<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripPulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Trip<span>Pulse</span></h1>
  <p>See your trips and check in when you arrive safely.</p>
</header>

<nav class="nav">
  <a href="index.html">Start a trip</a>
  <a href="trips.html" aria-current="page">My trips</a>
  <a href="lookup.html">Look up</a>
</nav>

<main>
  <section class="card">
    <div class="toolbar">
      <div>
        <h2>My trips</h2>
        <p class="sub">Trips started in this browser. Status updates every 30 seconds.</p>
      </div>
      <button class="btn" id="refresh-btn" type="button">Refresh</button>
    </div>
    <div id="trip-list"></div>
    <div id="list-msg" aria-live="polite"></div>
  </section>
</main>

<footer>
  Connected to <span id="api-label"></span>. Times are shown in your local time zone.
</footer>

<script src="app.js"></script>
<script>initTripsPage();</script>
</body>
</html>
